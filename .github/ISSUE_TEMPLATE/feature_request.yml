name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        For larger changes, an issue here helps agree direction before a big pull request. See the README **Contributing** section.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is hard, missing, or awkward today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
