name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this for new behaviour or improvements — not for something that is already broken (use **Bug report** instead).

        For larger changes, an issue here helps agree direction before a big pull request. See the README [Contributing](https://github.com/magicbug/OscarWatch-Tracker/blob/main/README.md#contributing) section.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of OscarWatch would this affect?
      options:
        - UI / operator workflow
        - Radio / CAT / doppler
        - Rotator
        - Tracking / passes / TLEs
        - Integrations (Cloudlog, GPS, hams.at, …)
        - Recording / audio
        - QSO logbook
        - Translations
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is hard, missing, or awkward today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Example use case
      description: A concrete pass, satellite, rig, or shack workflow where this would help.
      placeholder: |
        During FO-29 linear passes I often need to …
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, or workarounds you use now.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Are you willing to open a pull request?
      options:
        - "Yes — I can work on this"
        - "Maybe — with some guidance"
        - "No — suggestion only"
    validations:
      required: false
