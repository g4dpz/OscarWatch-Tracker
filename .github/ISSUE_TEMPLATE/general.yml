name: General (code-related)
description: Transponder data, translations, docs, or other repo/code contributions (not chat)
title: "[General]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this only for **code or repository work** that is not a bug or a feature request: for example a transponder database correction, a new UI language, or an operator-guide change that should land in the tree.

        **Not for:** how-do-I questions, shack setup advice, “is my radio supported?” chat, or general satellite operating talk. Those belong in [Discussions](https://github.com/magicbug/OscarWatch-Tracker/discussions). Issues are for work that ends up as a change (or a tracked follow-up to one).

        - **Something broken?** Use **Bug report**.
        - **New capability?** Use **Feature request**.
        - **Question or opinion?** Use [Discussions](https://github.com/magicbug/OscarWatch-Tracker/discussions).

  - type: checkboxes
    id: code-related
    attributes:
      label: This is code or repository related
      description: Confirm this issue proposes a concrete change to OscarWatch (source, data, translations, or docs in this repo), not a general question.
      options:
        - label: I have checked Discussions and this needs a tracked code/repo change (not a how-do-I or setup chat).
          required: true

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Transponder database (correction or new mode)
        - New UI language / translation
        - Documentation / operator guide (in-repo)
        - Other code or repository contribution
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What change are you proposing, and why does it belong in the OscarWatch repository?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: |
        For transponder data: satellite name, mode, frequencies (kHz), and a credible source (AMSAT page, official notice, your own verified QSO, etc.).
        For translations: locale code (for example `de-DE`), script/font needs, and whether you can maintain it across releases.
      placeholder: |
        Satellite: AO-07
        Mode: Mode A (downlink 29450 kHz, uplink 145900 kHz)
        Source: https://…
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: OscarWatch version (if relevant)
      description: Help → About, or leave blank.
      placeholder: "1.2.3"
    validations:
      required: false
